[General]

# SimulationParameters
# --------------------
# network *.ned-file and time-scale in nanoseconds
network=omnetpp_federate.mgmt.Simulation
simtime-resolution=1ns

# EventScheduler
# --------------
# scheduler-class and debugging option for more verbose logging
scheduler-class = "omnetpp_federate::MosaicEventScheduler"
mosaiceventscheduler-debug = false
# connection settings, when omnetpp-federate is started manually
mosaiceventscheduler-host = "localhost"
mosaiceventscheduler-port = 4998

# ClientServerChannel
# -------------------
# OMNeT++ log level names are valid, same hierarchy is used
clientserverchannel-log-level = warn

# RecordingModi
# -------------
record-eventlog = false
cmdenv-express-mode = false
cmdenv-event-banners = false
cmdenv-log-prefix = "[DEV] %t s: [%M] "

# random numbers
# -------------
num-rngs = 3
Simulation.mobility.rng-0 = 1
Simulation.wlan[*].mac.rng-0 = 2

# general logging output
# ----------------------

# These are setting suggestions for verbosity levels
# which are equivalent to MOSAIC's log level INFO and DEBUG
#
# MOSAIC log level equivalent:     INFO      DEBUG
#---------------------------------------------------
**.tx.cmdenv-log-level           = warn   # = info
**.rx.cmdenv-log-level           = warn   # = info
**.proxyApp.cmdenv-log-level     = info   # = info
Simulation.mgmt.cmdenv-log-level = info   # = info

# Simulation.binder.cmdenv-log-level = info
**.udp.cmdenv-log-level          = info
**.cmdenv-log-level             = warn   # = info   # This sets everything to level INFO

########### application settings ############
Simulation.rsu[*].udpApp.maxProcDelay = 0
Simulation.veh[*].udpApp.maxProcDelay = 0




########### Dynamic gNodeB Configuration ###########
# gNodeBs will be added dynamically through MOSAIC messages
# Configuration for dynamically created gNodeBs

# gNodeB basic configuration (for dynamically created nodes)
**.gnb[*].macCellId = ancestorIndex(0) + 1  # Use node index + 1 as cell ID
**.gnb[*].macNodeId = ancestorIndex(0) + 1  # Use node index + 1 as node ID

# gNodeB Scheduling configuration (for dynamically created nodes)
**.gnb[*].cellularNic.mac.schedulingDisciplineDl = "MAXCI"
**.gnb[*].cellularNic.mac.schedulingDisciplineUl = "MAXCI"
**.gnb[*].cellularNic.mac.harqProcesses = 8

########### PHY Layer Power Configuration ###########
# UE transmission power
**.ueTxPower = 26dBm

# gNodeB transmission power (for dynamically created nodes)
**.eNodeBTxPower = 46dBm

# Dynamic gNodeB mobility (position will be set by MOSAIC)
**.gnb[*].mobility.typename = "omnetpp_federate.node.MosaicMobility"

########### 5G Channel Control Configuration ###########
# NR Channel Control
**.channelControl.carrierFrequency = 2GHz
**.channelControl.numChannels = 1
**.channelControl.pMax = 20mW
**.channelControl.sat = -110dBm
**.channelControl.alpha = 4
**.channelControl.playgroundSizeX = 1000m
**.channelControl.playgroundSizeY = 1000m
**.channelControl.playgroundSizeZ = 50m

########### 5G Carrier Aggregation Configuration ###########
# Single carrier configuration
**.carrierAggregation.numComponentCarriers = 1
**.carrierAggregation.componentCarrier[0].carrierFrequency = 2GHz
**.carrierAggregation.componentCarrier[0].numBands = 6

# Link channel models to the carrier
**.gnb[*].cellularNic.numCarriers = 1
**.gnb[*].cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
**.gnb[*].upfAddress = "upf"

# GTP Gateway Configuration
**.gnb[*].gtpUser.gateway = "upf"

**.nrUe.cellularNic.numNRCarriers = 1
**.nrUe.cellularNic.nrChannelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"


########### UDP Settings      ###############

########### network layer settings ##########

########### mac and phy settings ############

**.wlan*.mgmt.typename = "Ieee80211MgmtAdhoc"
**.wlan*.agent.typename = ""
**.wlan*.opMode = "p"

**.wlan*.mac.typename = "Ieee80211Mac"
**.wlan*.mac.*.rateSelection.*Bitrate = 6Mbps
**.wlan*.mac.*.maxQueueSize = 10
**.wlan*.mac.**.cwMin = 15
**.wlan*.mac.**.cwMax = 1023
**.wlan*.mac.dcf.recoveryProcedure.shortRetryLimit = 7
**.wlan*.mac.dcf.recoveryProcedure.longRetryLimit = 7

**.wlan*.radio.bandName = "5.9 GHz"	#this string actually selects the band from {2.4; 5; 5.9} (see "IIeee80211Band.h")
**.wlan*.radio.carrierFrequency = 5.9GHz
**.wlan*.radio.channelNumber = 4
**.wlan*.radio.bandwidth = 10MHz
**.wlan*.radio.receiver.snirThreshold = 4dB
**.wlan*.radio.receiver.sensitivity = -81dBm
**.wlan*.radio.transmitter.power = 0.05W

########### radio medium settings ###########
Simulation.radioMedium.radioModeFilter = true	#use this filter for increased performance -> does not compute transmissions to receivers whose radio is turned off
Simulation.radioMedium.listeningFilter = true   #second filter that may improve performance
Simulation.radioMedium.backgroundNoise.power = -110dBm
Simulation.radioMedium.mediumLimitCache.carrierFrequency = 5.9GHz
Simulation.radioMedium.propagation.typename = "ConstantSpeedPropagation"
Simulation.radioMedium.pathLoss.typename = "FreeSpacePathLoss"
Simulation.radioMedium.obstacleLoss.typename = ""

Simulation.radioMedium.communicationCache.typename = "ReferenceCommunicationCache"  #use reference cache to avoid vector bounds issue


########### Core Network Configuration ###########
# User Plane Function (UPF) - handles packet routing between cells
Simulation.upf.trafficFlowFilterEnabled = false
Simulation.upf.hasRNISupport = false



# Multi-cell handover support
**.enableHandover = true
**.handoverDelta = 0.01
**.handoverLatency = 0.05s
**.dynamicCellAssociation = false
**.enableHandover = true


############### SCTP configuration ##################
**.sctp.nagleEnabled = false         # if true, transmission of small packets will be delayed on the X2
**.sctp.enableHeartbeats = false